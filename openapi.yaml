openapi: 3.1.0

info:
  title: Crustdata API
  version: "2025-11-01"
  summary: Real-time B2B company, people, job, web, and social data over a single versioned REST API.
  description: |
    Crustdata exposes the data layer behind sales, recruiting, and research
    workflows. You can search indexed datasets of companies, people, and jobs,
    enrich known entities with fresh attributes, resolve identifiers to a
    Crustdata ID, search the web, and fetch page content.

    All endpoints are `POST`, accept and return `application/json`, and require
    two headers:

    - `Authorization: Bearer <YOUR_API_KEY>`
    - `x-api-version: 2025-11-01`

    Get an API key and read the full guides at https://docs.crustdata.com.

    This OpenAPI specification is generated from the public documentation at
    https://docs.crustdata.com and is published for use with Swagger, Postman,
    and OpenAPI client/code generators.
  contact:
    name: Crustdata
    url: https://crustdata.com
    email: gtm@crustdata.co
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.crustdata.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Company
    description: Search, enrich, identify, and autocomplete company data.
  - name: Person
    description: Search, enrich, and autocomplete people data.
  - name: Job
    description: Search the indexed job dataset with filters and aggregations.
  - name: Web
    description: Live web search and page content retrieval.

paths:

  /company/search:
    post:
      tags: [Company]
      operationId: searchCompanies
      summary: Search companies with indexed fields
      description: Search the indexed company dataset using filters and sorting. Returns matched companies and a pagination cursor.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySearchRequest'
            examples:
              byDomain:
                summary: Find a company by its primary domain
                value:
                  filters:
                    field: basic_info.primary_domain
                    type: "="
                    value: hubspot.com
                  fields: [basic_info, headcount, funding]
                  limit: 1
      responses:
        '200':
          description: Matching companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/enrich:
    post:
      tags: [Company]
      operationId: enrichCompanies
      summary: Enrich companies
      description: |
        Return full company data for one or more known companies. Provide exactly
        one identifier type: `names`, `domains`, `crustdata_company_ids`, or
        `professional_network_profile_urls`. When `fields` is omitted, only
        `crustdata_company_id` and `basic_info` are returned.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyEnrichRequest'
            examples:
              byDomain:
                value:
                  domains: [serverobotics.com]
                  fields: [basic_info, headcount, funding]
      responses:
        '200':
          description: Enrichment results, one entry per requested identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyEnrichResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/identify:
    post:
      tags: [Company]
      operationId: identifyCompany
      summary: Identify a company
      description: |
        Resolve a company from a name, domain, Crustdata ID, or profile URL to a
        Crustdata ID plus basic info. Provide exactly one identifier type.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyIdentifyRequest'
            examples:
              byDomain:
                value:
                  domains: [serverobotics.com]
              byName:
                value:
                  names: [Serve Robotics]
              exactMatch:
                value:
                  domains: [cashfree.com]
                  exact_match: true
      responses:
        '200':
          description: Identify results, one entry per requested identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyIdentifyResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /company/search/autocomplete:
    post:
      tags: [Company]
      operationId: autocompleteCompanyField
      summary: Autocomplete company search fields
      description: Return suggested values for a company search field. An empty `query` returns the most frequent values.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocompleteRequest'
            examples:
              industries:
                value:
                  field: basic_info.industries
                  query: tech
                  limit: 5
      responses:
        '200':
          description: Suggested values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /person/search:
    post:
      tags: [Person]
      operationId: searchPeople
      summary: Search people using filters and sorting
      description: Search the indexed people dataset using filters, sorting, and pagination. Returns matched profiles and a pagination cursor.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonSearchRequest'
            examples:
              ctoAtMidMarket:
                value:
                  filters:
                    op: and
                    conditions:
                      - field: experience.employment_details.current.title
                        type: "="
                        value: CTO
                      - field: experience.employment_details.current.company_headcount_range
                        type: in
                        value: ["51-200", "201-500"]
                  sorts:
                    - field: crustdata_person_id
                      order: asc
                  limit: 2
      responses:
        '200':
          description: Matching people.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /person/enrich:
    post:
      tags: [Person]
      operationId: enrichPeople
      summary: Enrich people from cached dataset
      description: |
        Return enriched person profiles for known people. Provide exactly one of
        `professional_network_profile_urls` or `business_emails` (max 25 items).
        When `fields` is omitted, `basic_profile` and `social_handles` are returned.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonEnrichRequest'
            examples:
              byProfileUrl:
                value:
                  professional_network_profile_urls: ["https://www.linkedin.com/in/abhilashchowdhary"]
                  fields: [basic_profile, experience]
              byBusinessEmail:
                value:
                  business_emails: ["abhilash@crustdata.com"]
      responses:
        '200':
          description: Enrichment results, one entry per requested identifier.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonEnrichResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /person/search/autocomplete:
    post:
      tags: [Person]
      operationId: autocompletePersonField
      summary: Autocomplete person search fields
      description: Return suggested values for a person search field. An empty `query` returns the most frequent values.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocompleteRequest'
            examples:
              vpTitleAtGoogle:
                value:
                  field: experience.employment_details.current.title
                  query: VP
                  limit: 5
                  filters:
                    op: and
                    conditions:
                      - field: experience.employment_details.current.name
                        type: "="
                        value: Google
                      - field: basic_profile.location.country
                        type: "="
                        value: United States
      responses:
        '200':
          description: Suggested values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /job/search:
    post:
      tags: [Job]
      operationId: searchJobs
      summary: Search the indexed job dataset
      description: Search jobs using filters, sorting, pagination, and aggregations. Set `limit` to 0 to return aggregations only.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSearchRequest'
            examples:
              engineeringAtCompany:
                value:
                  filters:
                    op: and
                    conditions:
                      - field: company.basic_info.company_id
                        type: "="
                        value: 631394
                      - field: job_details.category
                        type: "="
                        value: Engineering
                      - field: metadata.date_added
                        type: "=>"
                        value: "2025-01-01"
                  fields: [job_details.title, job_details.url, metadata.date_added, location.country]
                  sorts:
                    - field: metadata.date_added
                      order: desc
                  limit: 20
      responses:
        '200':
          description: Matching jobs and any requested aggregations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /web/search/live:
    post:
      tags: [Web]
      operationId: webSearch
      summary: Web search (live)
      description: Run a live search across web, news, scholar, AI, and social sources.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
            examples:
              basic:
                value:
                  query: crustdata
                  location: US
                  sources: [web, news]
                  page: 1
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /web/enrich/live:
    post:
      tags: [Web]
      operationId: webFetch
      summary: Web fetch (live)
      description: Fetch full page content for up to 10 URLs.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebFetchRequest'
            examples:
              fetchOne:
                value:
                  urls: ["https://example.com"]
      responses:
        '200':
          description: Fetched page content, one entry per URL.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebFetchResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Pass your Crustdata API key as `Authorization: Bearer <YOUR_API_KEY>`."

  parameters:
    ApiVersion:
      name: x-api-version
      in: header
      required: true
      description: API version. Currently only `2025-11-01` is supported.
      schema:
        type: string
        enum: ["2025-11-01"]
        default: "2025-11-01"

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request
              message: "Unsupported columns in conditions: ['invalid_field']"
              metadata: []
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: unauthorized
              message: Invalid API key in request.
              metadata: []
    Forbidden:
      description: The account does not have access to this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: permission_error
              message: Search access not available for this account.
              metadata: []
    NotFound:
      description: No data found for the request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request
              message: No data found
              metadata: []
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: internal_error
              message: Internal server error
              metadata: []

  schemas:

    # ----- Shared error + filter primitives -----

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - unauthorized
                - insufficient_credits
                - permission_error
                - rate_limit_error
                - internal_error
            message:
              type: string
            metadata:
              type: array
              default: []
              items:
                type: object
                additionalProperties: true

    FilterOperator:
      type: string
      description: Comparison operator for a filter condition.
      enum:
        - "="
        - "!="
        - "<"
        - "=<"
        - ">"
        - "=>"
        - "in"
        - "not_in"
        - "contains"
        - "not_contains"
        - "(.)"
        - "(!)"
        - "[.]"
        - "is_null"
        - "is_not_null"
        - "geo_distance"

    FilterValue:
      description: Filter value. The accepted type depends on the operator.
      anyOf:
        - type: string
        - type: number
        - type: integer
        - type: boolean
        - type: array
          items: {}
        - type: object
          additionalProperties: true

    SearchCondition:
      type: object
      required: [field, type, value]
      properties:
        field:
          type: string
          description: Filter field name in dot-notation.
        type:
          $ref: '#/components/schemas/FilterOperator'
        value:
          $ref: '#/components/schemas/FilterValue'

    SearchConditionGroup:
      type: object
      required: [op, conditions]
      properties:
        op:
          type: string
          enum: [and, or]
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Filters'

    Filters:
      description: A single filter condition or an and/or group of conditions.
      oneOf:
        - $ref: '#/components/schemas/SearchCondition'
        - $ref: '#/components/schemas/SearchConditionGroup'

    SearchSort:
      type: object
      required: [field, order]
      properties:
        field:
          type: string
        order:
          type: string
          enum: [asc, desc]

    Location:
      type: object
      description: Structured location. Any field may be null.
      properties:
        raw: { type: [string, "null"] }
        city: { type: [string, "null"] }
        state: { type: [string, "null"] }
        country: { type: [string, "null"] }
        continent: { type: [string, "null"] }

    # ----- Autocomplete (shared by company + person) -----

    AutocompleteRequest:
      type: object
      required: [field, query]
      properties:
        field:
          type: string
          description: Dataset field name to suggest values for, in dot-notation.
        query:
          type: string
          description: Search text. An empty string returns the top values by frequency.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        filters:
          description: Optional filter to narrow suggestions.
          anyOf:
            - $ref: '#/components/schemas/Filters'
          nullable: true

    AutocompleteResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: object
            properties:
              value:
                type: string

    # ----- Company: search -----

    CompanySearchRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        cursor:
          type: string
          description: Pagination cursor from a previous response's `next_cursor`. Omit on the first page.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/SearchSort'
        fields:
          type: array
          description: "Field groups to return. Valid groups: basic_info, revenue, headcount, funding, hiring, locations, taxonomy, followers, social_profiles, software_reviews, metadata, updated_at, indexed_at, crustdata_company_id."
          items:
            type: string

    CompanySearchResponse:
      type: object
      required: [companies, next_cursor, total_count]
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        next_cursor:
          type: [string, "null"]
        total_count:
          type: [integer, "null"]
        query:
          type: object
          additionalProperties: true

    # ----- Company: enrich + identify -----

    CompanyEnrichRequest:
      type: object
      description: Provide exactly one identifier type.
      properties:
        names:
          type: array
          items: { type: string }
        domains:
          type: array
          items: { type: string }
        crustdata_company_ids:
          type: array
          items: { type: integer }
        professional_network_profile_urls:
          type: array
          items: { type: string }
        fields:
          type: array
          description: "Field groups to include. Valid groups: basic_info, headcount, funding, revenue, hiring, web_traffic, seo, competitors, employee_reviews, people, locations, taxonomy, followers, news, software_reviews, social_profiles, reviews, public_launches, market_intel, metadata, crustdata_company_id, updated_at, indexed_at."
          items: { type: string }
        exact_match:
          type: [boolean, "null"]
          description: Enforce strict matching. Null auto-detects.
      oneOf:
        - required: [names]
        - required: [domains]
        - required: [crustdata_company_ids]
        - required: [professional_network_profile_urls]

    CompanyIdentifyRequest:
      type: object
      description: Provide exactly one identifier type.
      properties:
        names:
          type: array
          items: { type: string }
        domains:
          type: array
          items: { type: string }
        crustdata_company_ids:
          type: array
          items: { type: integer }
        professional_network_profile_urls:
          type: array
          items: { type: string }
        fields:
          type: array
          items: { type: string }
        exact_match:
          type: [boolean, "null"]
      oneOf:
        - required: [names]
        - required: [domains]
        - required: [crustdata_company_ids]
        - required: [professional_network_profile_urls]

    CompanyMatchType:
      type: string
      enum: [domain, name, crustdata_company_id, professional_network_profile_url]

    CompanyEnrichResult:
      type: object
      properties:
        matched_on:
          type: string
          description: The input identifier that was matched.
        match_type:
          $ref: '#/components/schemas/CompanyMatchType'
        matches:
          type: array
          items:
            type: object
            properties:
              confidence_score:
                type: number
                description: Match confidence between 0 and 1.
              company_data:
                $ref: '#/components/schemas/Company'

    CompanyIdentifyResult:
      type: object
      properties:
        matched_on:
          type: string
        match_type:
          $ref: '#/components/schemas/CompanyMatchType'
        matches:
          type: array
          items:
            type: object
            properties:
              confidence_score:
                type: number
              company_data:
                $ref: '#/components/schemas/Company'

    # ----- Company object (union of search + enrich fields) -----

    Company:
      type: object
      description: Company record. Which top-level groups are present depends on the requested `fields`.
      properties:
        crustdata_company_id: { type: integer }
        updated_at: { type: [string, "null"], format: date-time }
        indexed_at: { type: [string, "null"], format: date-time }
        metadata:
          type: object
          properties:
            growth_calculation_date: { type: [string, "null"] }
        basic_info:
          type: object
          properties:
            crustdata_company_id: { type: integer }
            name: { type: [string, "null"] }
            primary_domain: { type: [string, "null"] }
            all_domains: { type: [array, "null"], items: { type: string } }
            website: { type: [string, "null"] }
            professional_network_url: { type: [string, "null"] }
            professional_network_id: { type: [string, "null"] }
            profile_name: { type: [string, "null"] }
            logo_permalink: { type: [string, "null"] }
            description: { type: [string, "null"] }
            company_type: { type: [string, "null"] }
            year_founded: { type: [integer, "null"] }
            employee_count_range: { type: [string, "null"] }
            markets: { type: [array, "null"], items: { type: string } }
            industries: { type: [array, "null"], items: { type: string } }
        headcount:
          type: object
          properties:
            total: { type: [integer, "null"] }
            largest_headcount_country: { type: [string, "null"] }
            timeseries:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  employee_count: { type: integer }
            growth_percent:
              type: object
              additionalProperties: { type: number }
              description: Keys such as mom, qoq, six_months, yoy, two_years (or 1m/3m/6m/12m in search).
            growth_absolute:
              type: object
              additionalProperties: { type: integer }
            by_role_absolute: { type: object, additionalProperties: true }
            by_role_percent: { type: object, additionalProperties: true }
            by_region_absolute: { type: object, additionalProperties: true }
            by_region_percent: { type: object, additionalProperties: true }
            by_skill_absolute: { type: object, additionalProperties: true }
            by_skill_percent: { type: object, additionalProperties: true }
            by_function_timeseries: { type: object, additionalProperties: true }
        funding:
          type: object
          properties:
            total_investment_usd: { type: [number, "null"] }
            last_round_amount_usd: { type: [number, "null"] }
            last_fundraise_date: { type: [string, "null"], format: date }
            last_round_type: { type: [string, "null"] }
            investors: { type: [array, "null"], items: { type: string } }
            milestones:
              type: array
              items:
                type: object
                properties:
                  date: { type: [string, "null"], format: date }
                  funding_date: { type: [string, "null"], format: date }
                  amount_usd: { type: [number, "null"] }
                  round_type: { type: [string, "null"] }
                  investors: { type: [string, "null"] }
                  lead_investors: { type: [string, "null"] }
            investors_detailed:
              type: array
              items:
                type: object
                properties:
                  name: { type: [string, "null"] }
                  uuid: { type: [string, "null"] }
                  type: { type: [string, "null"] }
                  categories: { type: array, items: { type: string } }
                  permalink: { type: [string, "null"] }
                  crunchbase_profile_url: { type: [string, "null"] }
            acquisitions:
              type: array
              items: { type: object, additionalProperties: true }
            acquired_by:
              type: array
              items: { type: object, additionalProperties: true }
        revenue:
          type: object
          properties:
            estimated:
              type: object
              properties:
                lower_bound_usd: { type: [integer, "null"] }
                upper_bound_usd: { type: [integer, "null"] }
                timeseries:
                  type: array
                  items:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      revenue_usd: { type: integer }
            public_markets:
              type: object
              properties:
                ipo_date: { type: [string, "null"], format: date }
                stock_symbols: { type: [array, "null"], items: { type: string } }
                fiscal_year_end: { type: [string, "null"] }
            acquisition_status: { type: [string, "null"] }
        hiring:
          type: object
          properties:
            recent_titles_csv: { type: [string, "null"] }
            openings_count: { type: [integer, "null"] }
            openings_growth_percent: { type: object, additionalProperties: { type: number } }
            by_function_qoq_pct: { type: object, additionalProperties: { type: number } }
            by_function_6m_pct: { type: object, additionalProperties: { type: number } }
            open_jobs_timeseries:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  open_jobs: { type: integer }
            recent_openings:
              type: array
              items: { type: object, additionalProperties: true }
        web_traffic:
          type: object
          additionalProperties: true
          description: Per-domain traffic metrics keyed by domain.
        seo:
          type: object
          additionalProperties: true
        competitors:
          type: object
          properties:
            all_domains: { type: array, items: { type: string } }
            paid_seo: { type: array, items: { type: string } }
            organic_seo: { type: array, items: { type: string } }
        employee_reviews:
          type: object
          additionalProperties: true
        people:
          type: object
          properties:
            decision_makers:
              type: array
              items: { type: object, additionalProperties: true }
            founders:
              type: array
              items: { type: object, additionalProperties: true }
            cxos:
              type: array
              items: { type: object, additionalProperties: true }
        locations:
          type: object
          properties:
            country: { type: [string, "null"] }
            headquarters: { type: [string, "null"] }
            street_address: { type: [string, "null"] }
            state: { type: [string, "null"] }
            all_office_addresses: { type: [array, "null"], items: { type: string } }
        taxonomy:
          type: object
          properties:
            professional_network_specialities: { type: [array, "null"], items: { type: string } }
            professional_network_industry: { type: [string, "null"] }
            professional_network_industries: { type: [array, "null"], items: { type: string } }
            categories: { type: [array, "null"], items: { type: string } }
            primary_naics_detail: { type: object, additionalProperties: true }
            sic_detail_list: { type: array, items: { type: object, additionalProperties: true } }
        followers:
          type: object
          properties:
            count: { type: [integer, "null"], default: 0 }
            mom_percent: { type: [number, "null"], default: 0 }
            qoq_percent: { type: [number, "null"], default: 0 }
            six_months_growth_percent: { type: [number, "null"], default: 0 }
            yoy_percent: { type: [number, "null"], default: 0 }
            timeseries:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  follower_count: { type: integer }
        social_profiles:
          type: object
          properties:
            crunchbase:
              type: object
              properties:
                url: { type: [string, "null"] }
                uuid: { type: [string, "null"] }
            twitter_url: { type: [string, "null"] }
            professional_network: { type: [string, "null"] }
        software_reviews:
          type: object
          properties:
            review_count: { type: [integer, "null"] }
            average_rating: { type: [number, "null"] }
            review_count_mom_pct: { type: [number, "null"] }
            review_count_qoq_pct: { type: [number, "null"] }
            review_count_yoy_pct: { type: [number, "null"] }
        reviews:
          type: object
          additionalProperties: true
        news:
          type: array
          items: { type: object, additionalProperties: true }
        public_launches:
          type: object
          additionalProperties: true
        market_intel:
          type: object
          additionalProperties: true

    # ----- Person: search -----

    PersonSearchRequest:
      type: object
      required: [filters]
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        sorts:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/SearchSort'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        count:
          type: integer
          minimum: 1
          maximum: 1000
          description: Alias for `limit`.
        cursor:
          type: string
        post_processing:
          type: object
          properties:
            exclude_profiles:
              type: array
              items: { type: string }
            exclude_names:
              type: array
              items: { type: string }
        return_query:
          type: boolean
          default: false
        preview:
          type: boolean
          default: false
          description: Fast mode returning only basic fields.
        fields:
          type: array
          items: { type: string }

    PersonSearchResponse:
      type: object
      required: [profiles, next_cursor, total_count]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/PersonProfile'
        next_cursor:
          type: [string, "null"]
        total_count:
          type: [integer, "null"]

    # ----- Person: enrich -----

    PersonEnrichRequest:
      type: object
      description: Provide exactly one of `professional_network_profile_urls` or `business_emails`.
      properties:
        professional_network_profile_urls:
          type: array
          maxItems: 25
          items: { type: string }
        business_emails:
          type: array
          maxItems: 25
          items: { type: string, format: email }
        fields:
          type: array
          description: "Field groups to include. Valid: basic_profile, professional_network, skills, contact, social_handles, experience, education, certifications, honors, dev_platform_profiles."
          items: { type: string }
        min_similarity_score:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        preview:
          type: boolean
          default: false
          description: Preview mode returns only basic profile and charges 0 credits.
      oneOf:
        - required: [professional_network_profile_urls]
        - required: [business_emails]

    PersonEnrichResult:
      type: object
      properties:
        matched_on:
          type: string
        match_type:
          type: string
          enum: [professional_network_profile_url, business_email]
        matches:
          type: array
          items:
            type: object
            properties:
              confidence_score:
                type: number
              person_data:
                $ref: '#/components/schemas/PersonProfile'

    # ----- Person object (union of search + enrich fields) -----

    PersonProfile:
      type: object
      description: Person record. Which groups are present depends on the requested `fields`.
      properties:
        crustdata_person_id: { type: integer }
        basic_profile:
          type: object
          properties:
            name: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            headline: { type: string }
            current_title: { type: string }
            summary: { type: string }
            professional_network_name: { type: [string, "null"] }
            languages: { type: array, items: { type: string } }
            normalized_title:
              $ref: '#/components/schemas/NormalizedTitle'
            last_updated: { type: [string, "null"] }
            profile_picture_permalink: { type: [string, "null"] }
            location:
              $ref: '#/components/schemas/Location'
        professional_network:
          type: object
          properties:
            profile_picture_url: { type: string }
            profile_picture_permalink: { type: string }
            name: { type: string }
            pronoun: { type: string }
            headline: { type: string }
            current_title: { type: string }
            summary: { type: string }
            location:
              $ref: '#/components/schemas/Location'
            connections: { type: [integer, "null"] }
            followers: { type: [integer, "null"] }
            joined_date: { type: [string, "null"] }
            verifications: { type: array, items: { type: string } }
            open_to_cards:
              type: array
              items:
                type: string
                enum: [CAREER_INTEREST, HIRING_MANAGER, VOLUNTEERING]
            metadata:
              type: object
              properties:
                last_scraped_source: { type: [string, "null"], format: date-time }
        skills:
          type: object
          properties:
            professional_network_skills: { type: array, items: { type: string } }
        contact:
          type: object
          description: In search responses, presence flags only. In enrich responses, full contact details.
          properties:
            has_business_email: { type: boolean }
            has_personal_email: { type: boolean }
            has_phone_number: { type: boolean }
            business_emails:
              type: array
              items: { $ref: '#/components/schemas/EmailEntry' }
            personal_emails:
              type: array
              items: { $ref: '#/components/schemas/EmailEntry' }
            phone_numbers: { type: array, items: { type: string } }
            websites: { type: array, items: { type: string } }
        social_handles:
          type: object
          properties:
            professional_network_identifier:
              type: object
              properties:
                profile_url: { type: string }
            dev_platform_identifier:
              type: object
              properties:
                profile_url: { type: [string, "null"] }
            twitter_identifier:
              type: object
              properties:
                slug: { type: string }
        dev_platform_profiles:
          type: array
          items: { type: object, additionalProperties: true }
        experience:
          type: object
          properties:
            employment_details:
              type: object
              properties:
                current:
                  type: array
                  items: { $ref: '#/components/schemas/EmploymentDetail' }
                past:
                  type: array
                  items: { $ref: '#/components/schemas/EmploymentDetail' }
        certifications:
          type: array
          items: { type: object, additionalProperties: true }
        honors:
          type: array
          items: { type: object, additionalProperties: true }
        education:
          type: object
          properties:
            schools:
              type: array
              items: { $ref: '#/components/schemas/School' }
        updated_at: { type: string }

    NormalizedTitle:
      type: [object, "null"]
      properties:
        matched_title: { type: [string, "null"] }
        department: { type: [string, "null"] }
        sub_department: { type: [string, "null"] }
        similarity: { type: [number, "null"] }
        confident: { type: [boolean, "null"] }

    EmailEntry:
      type: object
      properties:
        email: { type: string }
        status: { type: string, enum: [verified, unverified] }
        last_updated: { type: [string, "null"], format: date-time }
        crustdata_company_id: { type: [integer, "null"] }

    EmploymentDetail:
      type: object
      properties:
        name: { type: [string, "null"] }
        professional_network_id: { type: [string, "null"] }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location:
          type: object
          properties:
            raw: { type: [string, "null"] }
        employment_type: { type: [string, "null"] }
        start_date: { type: [string, "null"] }
        end_date: { type: [string, "null"] }
        is_default: { type: [boolean, "null"] }
        crustdata_company_id: { type: [integer, "null"] }
        company_website_domain: { type: [string, "null"] }
        company_profile_picture_permalink: { type: [string, "null"] }
        company_professional_network_profile_url: { type: [string, "null"] }
        seniority_level: { type: [string, "null"] }
        function_category: { type: [string, "null"] }
        years_at_company: { type: [string, "null"] }
        years_at_company_raw: { type: [number, "null"] }
        company_headcount_latest: { type: [integer, "null"] }
        company_headcount_range: { type: [string, "null"] }
        company_industries: { type: array, items: { type: string } }
        company_professional_network_industry: { type: [string, "null"] }
        company_type: { type: [string, "null"] }
        company_website: { type: [string, "null"] }
        company_headquarters_country: { type: [string, "null"] }
        company_hq_location: { type: [string, "null"] }
        company_hq_location_address_components: { type: array, items: { type: string } }
        position_id: { type: [integer, "null"] }
        business_email_verified: { type: [boolean, "null"] }

    School:
      type: object
      properties:
        school: { type: string }
        degree: { type: [string, "null"] }
        field_of_study: { type: [string, "null"] }
        description: { type: [string, "null"] }
        location:
          $ref: '#/components/schemas/Location'
        start_year: { type: [integer, "null"] }
        end_year: { type: [integer, "null"] }
        activities_and_societies: { type: [string, "null"] }
        institute_logo_permalink: { type: [string, "null"] }
        institute_logo_url: { type: [string, "null"] }
        professional_network_id: { type: [string, "null"] }

    # ----- Job: search -----

    JobSearchRequest:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        cursor:
          type: string
        limit:
          type: integer
          minimum: 0
          maximum: 1000
          default: 20
          description: Set to 0 to return aggregations only.
        sorts:
          type: array
          items:
            $ref: '#/components/schemas/SearchSort'
        fields:
          type: array
          description: "Field groups: crustdata_job_id, job_details, company, location, content, metadata."
          items: { type: string }
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/AggregationRequest'

    AggregationRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [count, group_by]
        column:
          type: [string, "null"]
          description: Required for group_by.
        agg:
          type: [string, "null"]
          description: Required for group_by. Currently only `count`.
        size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100

    JobSearchResponse:
      type: object
      required: [job_listings]
      properties:
        job_listings:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: [string, "null"]
        total_count:
          type: [integer, "null"]
        aggregations:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/AggregationResponseItem'

    Job:
      type: object
      properties:
        crustdata_job_id: { type: integer }
        job_details:
          type: object
          properties:
            job_id: { type: [integer, "null"] }
            title: { type: [string, "null"] }
            category: { type: [string, "null"] }
            workplace_type: { type: [string, "null"] }
            url: { type: [string, "null"] }
            reposted_job: { type: [boolean, "null"] }
            number_of_openings: { type: [integer, "null"] }
        company:
          type: object
          properties:
            basic_info:
              type: object
              properties:
                crustdata_company_id: { type: [integer, "null"] }
                name: { type: [string, "null"] }
                primary_domain: { type: [string, "null"] }
                website: { type: [string, "null"] }
                professional_network_id: { type: [string, "null"] }
                industries: { type: [array, "null"], items: { type: string } }
            locations:
              type: object
              properties:
                country: { type: [string, "null"] }
                state: { type: [string, "null"] }
                city: { type: [string, "null"] }
                street_address: { type: [string, "null"] }
            headcount:
              type: object
              properties:
                total: { type: [integer, "null"] }
                range: { type: [string, "null"] }
                largest_headcount_country: { type: [string, "null"] }
            followers:
              type: object
              properties:
                count: { type: [integer, "null"] }
            revenue:
              type: object
              properties:
                estimated:
                  type: object
                  properties:
                    lower_bound_usd: { type: [integer, "null"] }
                    upper_bound_usd: { type: [integer, "null"] }
                public_markets:
                  type: [object, "null"]
                  properties:
                    stock_symbols: { type: [array, "null"], items: { type: string } }
                    fiscal_year_end: { type: [string, "null"] }
                acquisition_status: { type: [string, "null"] }
            funding:
              type: object
              properties:
                total_investment_usd: { type: [number, "null"] }
                valuation_usd: { type: [number, "null"] }
                last_fundraise_date: { type: [string, "null"] }
                last_round_type: { type: [string, "null"] }
                num_funding_rounds: { type: [integer, "null"] }
                investors: { type: [array, "null"], items: { type: string } }
            competitors:
              type: object
              properties:
                websites: { type: [array, "null"], items: { type: string } }
        location:
          type: object
          properties:
            raw: { type: [string, "null"] }
            city: { type: [string, "null"] }
            district: { type: [string, "null"] }
            state: { type: [string, "null"] }
            country: { type: [string, "null"] }
            pincode: { type: [string, "null"] }
        content:
          type: object
          properties:
            description: { type: [string, "null"] }
        metadata:
          type: object
          properties:
            date_added: { type: [string, "null"] }
            date_updated: { type: [string, "null"] }

    AggregationResponseItem:
      type: object
      properties:
        type:
          type: string
          enum: [count, group_by]
        column: { type: [string, "null"] }
        value: { type: [integer, "null"] }
        buckets:
          type: [array, "null"]
          items:
            type: object
            properties:
              key:
                anyOf:
                  - type: string
                  - type: integer
                  - type: number
              count: { type: integer }
              metadata: { type: [object, "null"], additionalProperties: true }

    # ----- Web: search -----

    WebSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 5000
        location:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2 country code for location targeting.
        sources:
          type: [array, "null"]
          items:
            type: string
            enum: [news, web, scholar-articles, scholar-articles-enriched, scholar-author, ai, social]
        site:
          type: [string, "null"]
          maxLength: 500
          description: Restrict results to a specific site domain.
        start_date:
          type: [integer, "null"]
          description: Unix timestamp (seconds).
        end_date:
          type: [integer, "null"]
          description: Unix timestamp (seconds).
        human_mode:
          type: boolean
          default: false
        page:
          type: integer
          minimum: 1
          default: 1

    WebSearchResponse:
      type: object
      properties:
        success: { type: boolean }
        query: { type: string }
        timestamp:
          type: integer
          description: Unix timestamp in milliseconds.
        results:
          type: array
          items:
            $ref: '#/components/schemas/WebSearchResult'
        metadata:
          type: object
          properties:
            total_results: { type: integer, minimum: 0 }
            failed_pages: { type: array, items: { type: integer } }
            empty_pages: { type: array, items: { type: integer } }

    WebSearchResult:
      type: object
      description: Shape varies by `source`. Common and source-specific fields are listed below.
      additionalProperties: true
      properties:
        source:
          type: string
          enum: [web, news, scholar-articles, scholar-author, ai, social]
        title: { type: string }
        url: { type: string }
        snippet: { type: string }
        position: { type: integer }

    # ----- Web: fetch -----

    WebFetchRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 2000
            description: Fully-qualified http(s) URL.
        human_mode:
          type: boolean
          default: false

    WebFetchResult:
      type: object
      properties:
        success: { type: [boolean, "null"] }
        url: { type: [string, "null"] }
        timestamp: { type: [integer, "null"], description: Unix timestamp (seconds). }
        title: { type: [string, "null"] }
        content: { type: [string, "null"], description: Full HTML content. }
